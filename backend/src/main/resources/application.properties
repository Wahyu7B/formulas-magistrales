spring.application.name=formulas-avance2
server.port=${API_PORT:8082}
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:55439/formulas_avance2}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.jwt.secret=${JWT_SECRET}
app.cors.origin=${FRONTEND_ORIGIN:http://localhost:4202,http://127.0.0.1:4202}
app.seed.enabled=${SEED_ENABLED:false}

